services:
  mailhog:
    image: mailhog/mailhog:v1.0.1
    profiles: [dev]
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PB_HOST_PORT:-8090}:8090"
    volumes:
      - pb_data:/app/pb_data
    restart: unless-stopped
    depends_on:
      mailhog:
        condition: service_started
        required: false
    # Copy .env.example to .env and set real credentials before running.
    # PB_SUPERUSER_EMAIL and PB_SUPERUSER_PASSWORD are required — no defaults.
    env_file:
      - .env
    environment:
      PB_SUPERUSER_EMAIL: ${PB_SUPERUSER_EMAIL:?PB_SUPERUSER_EMAIL must be set in .env}
      PB_SUPERUSER_PASSWORD: ${PB_SUPERUSER_PASSWORD:?PB_SUPERUSER_PASSWORD must be set in .env}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_DISABLE: ${GOOGLE_OAUTH_DISABLE:-}
      SMTP_HOST: ${SMTP_HOST:-mailhog}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-notifications@kit.local}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_DISABLE: ${SMTP_DISABLE:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:5173}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pb_data:
