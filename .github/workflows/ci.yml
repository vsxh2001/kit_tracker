name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled]
  schedule:
    - cron: "0 6 * * *"  # daily 6am UTC

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Type-check and build
        run: cd frontend && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --build-arg BUILDKIT_INLINE_CACHE=1 -t kit-tracker:ci .

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Download PocketBase
        run: |
          curl -sSL https://github.com/pocketbase/pocketbase/releases/download/v0.22.22/pocketbase_0.22.22_linux_amd64.zip -o /tmp/pb.zip
          unzip -o /tmp/pb.zip pocketbase -d pb/
          chmod +x pb/pocketbase pb/setup_collections.sh pb/seed_test_users.sh

      - name: Start PocketBase
        env:
          PB_HTTP: 0.0.0.0:8090
          PB_DATA_DIR: /tmp/pb_data
        run: bash pb/start-pb.sh &

      - name: Wait for PocketBase
        run: timeout 30 bash -c 'until curl -sf http://127.0.0.1:8090/api/health; do sleep 1; done'

      - name: Create CI admin
        run: ./pb/pocketbase admin create ci@example.com CIpassword123! --dir=/tmp/pb_data

      - name: Set up collections
        run: ./pb/setup_collections.sh ci@example.com CIpassword123!

      - name: Seed test users
        run: ./pb/seed_test_users.sh ci@example.com CIpassword123!

      - name: Start Vite dev server
        run: cd frontend && npm run dev &

      - name: Wait for Vite
        run: timeout 30 bash -c 'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 1; done'

      - name: Run smoke tests
        run: cd frontend && npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop background services
        if: always()
        run: |
          pkill -f "pocketbase serve" || true
          pkill -f "vite" || true
          pkill -f "npm run dev" || true

  e2e-full:
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-e2e')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Download PocketBase
        run: |
          curl -sSL https://github.com/pocketbase/pocketbase/releases/download/v0.22.22/pocketbase_0.22.22_linux_amd64.zip -o /tmp/pb.zip
          unzip -o /tmp/pb.zip pocketbase -d pb/
          chmod +x pb/pocketbase pb/setup_collections.sh pb/seed_test_users.sh

      - name: Start PocketBase
        env:
          PB_HTTP: 0.0.0.0:8090
          PB_DATA_DIR: /tmp/pb_data
        run: bash pb/start-pb.sh &

      - name: Wait for PocketBase
        run: timeout 30 bash -c 'until curl -sf http://127.0.0.1:8090/api/health; do sleep 1; done'

      - name: Create CI admin
        run: ./pb/pocketbase admin create ci@example.com CIpassword123! --dir=/tmp/pb_data

      - name: Set up collections
        run: ./pb/setup_collections.sh ci@example.com CIpassword123!

      - name: Seed test users
        run: ./pb/seed_test_users.sh ci@example.com CIpassword123!

      - name: Start Vite dev server
        run: cd frontend && npm run dev &

      - name: Wait for Vite
        run: timeout 30 bash -c 'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 1; done'

      - name: Run full Playwright suite
        run: cd frontend && npm run test:full

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop background services
        if: always()
        run: |
          pkill -f "pocketbase serve" || true
          pkill -f "vite" || true
          pkill -f "npm run dev" || true
