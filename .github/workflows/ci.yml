name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Type-check and build
        run: cd frontend && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --build-arg BUILDKIT_INLINE_CACHE=1 -t kit-tracker:ci .

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Download PocketBase
        run: |
          curl -sSL https://github.com/pocketbase/pocketbase/releases/download/v0.22.22/pocketbase_0.22.22_linux_amd64.zip -o /tmp/pb.zip
          unzip -o /tmp/pb.zip pocketbase -d pb/
          chmod +x pb/pocketbase pb/setup_collections.sh pb/seed_test_users.sh

      - name: Start PocketBase
        run: ./pb/pocketbase serve --http=0.0.0.0:8090 --dir=/tmp/pb_data &

      - name: Wait for PocketBase
        run: timeout 30 bash -c 'until curl -sf http://127.0.0.1:8090/api/health; do sleep 1; done'

      - name: Create CI admin
        run: ./pb/pocketbase admin create ci@example.com CIpassword123! --dir=/tmp/pb_data

      - name: Set up collections
        run: ./pb/setup_collections.sh ci@example.com CIpassword123!

      - name: Seed test users
        run: ./pb/seed_test_users.sh ci@example.com CIpassword123!

      - name: Start Vite dev server
        run: cd frontend && npm run dev &

      - name: Wait for Vite
        run: timeout 30 bash -c 'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 1; done'

      - name: Run Playwright tests
        run: cd frontend && npm run test:ci

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop background services
        if: always()
        run: |
          pkill -f "pocketbase serve" || true
          pkill -f "vite" || true
          pkill -f "npm run dev" || true

  container-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        oauth: [disabled, enabled]
    env:
      HAVE_OAUTH_SECRETS: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Set up .env for docker compose
        run: |
          cat > .env <<'EOF'
          PB_SUPERUSER_EMAIL=ci@example.com
          PB_SUPERUSER_PASSWORD=CIpassword123!
          GOOGLE_OAUTH_CLIENT_ID=${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET=${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          EOF

      - name: Disable OAuth for this matrix entry
        if: matrix.oauth == 'disabled'
        run: |
          echo "GOOGLE_OAUTH_DISABLE=1" >> .env

      - name: Run e2e suite via docker compose
        if: matrix.oauth == 'disabled' || env.HAVE_OAUTH_SECRETS == 'true'
        run: bash scripts/test-prod.sh

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-container-${{ matrix.oauth }}
          path: frontend/playwright-report/
          retention-days: 7
