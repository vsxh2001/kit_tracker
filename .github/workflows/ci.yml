name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
    types: [opened, synchronize, labeled]
  schedule:
    - cron: "0 6 * * *"  # daily 6am UTC

# Cancel in-flight runs for the same branch on push — a fix-up commit
# kills the previous CI wave rather than queueing 4 stale runs per branch.
# Main is exempt: every commit on main must pass to gate prod deploy.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Type-check and build
        run: cd frontend && npm run build

  hook-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download PocketBase
        run: |
          curl -sSL https://github.com/pocketbase/pocketbase/releases/download/v0.22.22/pocketbase_0.22.22_linux_amd64.zip -o /tmp/pb.zip
          unzip -o /tmp/pb.zip pocketbase -d pb/
          chmod +x pb/pocketbase

      - name: Audit findRecordsByFilter arg order
        run: node scripts/audit-find-records.mjs

      - name: Run PB hook tests
        run: npm run test:hooks

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --build-arg BUILDKIT_INLINE_CACHE=1 -t kit-tracker:ci .

  e2e:
    runs-on: ubuntu-latest
    needs: build
    env:
      SEED_TEST_USERS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        # Retry: `--with-deps` runs `apt-get update` which occasionally fails
        # with a Hash Sum mismatch against Google's chrome-stable apt mirror.
        run: |
          cd frontend
          for i in 1 2 3; do
            if npx playwright install chromium --with-deps; then
              exit 0
            fi
            echo "::warning::playwright install attempt $i failed; retrying in $((i * 15))s..."
            sleep $((i * 15))
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1

      - name: Download PocketBase
        run: |
          curl -sSL https://github.com/pocketbase/pocketbase/releases/download/v0.22.22/pocketbase_0.22.22_linux_amd64.zip -o /tmp/pb.zip
          unzip -o /tmp/pb.zip pocketbase -d pb/
          chmod +x pb/pocketbase pb/setup_collections.sh pb/seed_test_users.sh

      - name: Start PocketBase
        env:
          PB_HTTP: 0.0.0.0:8090
          PB_DATA_DIR: /tmp/pb_data
        run: bash pb/start-pb.sh &

      - name: Wait for PocketBase
        run: timeout 30 bash -c 'until curl -sf http://127.0.0.1:8090/api/health; do sleep 1; done'

      - name: Create CI admin
        run: ./pb/pocketbase admin create ci@example.com CIpassword123! --dir=/tmp/pb_data

      - name: Set up collections
        run: ./pb/setup_collections.sh ci@example.com CIpassword123!

      - name: Seed test users
        run: ./pb/seed_test_users.sh ci@example.com CIpassword123!

      - name: Start Vite dev server
        run: cd frontend && npm run dev &

      - name: Wait for Vite
        run: timeout 30 bash -c 'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 1; done'

      - name: Run smoke tests
        env:
          PB_SUPERUSER_EMAIL: ci@example.com
          PB_SUPERUSER_PASSWORD: CIpassword123!
        run: cd frontend && npm run test:smoke

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop background services
        if: always()
        run: |
          pkill -f "pocketbase serve" || true
          pkill -f "vite" || true
          pkill -f "npm run dev" || true

  prod-smoke:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5
    env:
      SEED_TEST_USERS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        # Retry: `--with-deps` runs `apt-get update` which occasionally fails
        # with a Hash Sum mismatch against Google's chrome-stable apt mirror.
        run: |
          cd frontend
          for i in 1 2 3; do
            if npx playwright install chromium --with-deps; then
              exit 0
            fi
            echo "::warning::playwright install attempt $i failed; retrying in $((i * 15))s..."
            sleep $((i * 15))
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1

      - name: Build frontend with prod-like env
        run: cd frontend && VITE_PB_URL="http://127.0.0.1:8090" npm run build

      - name: Download PocketBase
        run: |
          curl -sSL https://github.com/pocketbase/pocketbase/releases/download/v0.22.22/pocketbase_0.22.22_linux_amd64.zip -o /tmp/pb.zip
          unzip -o /tmp/pb.zip pocketbase -d pb/
          chmod +x pb/pocketbase pb/setup_collections.sh pb/seed_test_users.sh

      - name: Start PocketBase
        env:
          PB_HTTP: 0.0.0.0:8090
          PB_DATA_DIR: /tmp/pb_data
        run: bash pb/start-pb.sh &

      - name: Wait for PocketBase
        run: timeout 30 bash -c 'until curl -sf http://127.0.0.1:8090/api/health; do sleep 1; done'

      - name: Create CI admin
        run: ./pb/pocketbase admin create ci@example.com CIpassword123! --dir=/tmp/pb_data

      - name: Set up collections
        run: ./pb/setup_collections.sh ci@example.com CIpassword123!

      - name: Seed test users
        run: ./pb/seed_test_users.sh ci@example.com CIpassword123!

      - name: Serve prod dist on 5174
        run: cd frontend && npx serve dist -s -l 5174 &

      - name: Wait for dist server
        run: timeout 30 bash -c 'until curl -sf http://localhost:5174 > /dev/null 2>&1; do sleep 1; done'

      - name: Run prod-smoke tests
        run: cd frontend && PLAYWRIGHT_TEST_BASE_URL=http://localhost:5174 npx playwright test e2e/prod-smoke.spec.ts --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-prod-smoke
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop background services
        if: always()
        run: |
          pkill -f "serve dist" || true
          pkill -f "pocketbase serve" || true

  e2e-full:
    if: github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'full-e2e')
    runs-on: ubuntu-latest
    needs: build
    env:
      SEED_TEST_USERS: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        # Retry: `--with-deps` runs `apt-get update` which occasionally fails
        # with a Hash Sum mismatch against Google's chrome-stable apt mirror.
        run: |
          cd frontend
          for i in 1 2 3; do
            if npx playwright install chromium --with-deps; then
              exit 0
            fi
            echo "::warning::playwright install attempt $i failed; retrying in $((i * 15))s..."
            sleep $((i * 15))
          done
          echo "::error::playwright install failed after 3 attempts"
          exit 1

      - name: Download PocketBase
        run: |
          curl -sSL https://github.com/pocketbase/pocketbase/releases/download/v0.22.22/pocketbase_0.22.22_linux_amd64.zip -o /tmp/pb.zip
          unzip -o /tmp/pb.zip pocketbase -d pb/
          chmod +x pb/pocketbase pb/setup_collections.sh pb/seed_test_users.sh

      - name: Start PocketBase
        env:
          PB_HTTP: 0.0.0.0:8090
          PB_DATA_DIR: /tmp/pb_data
        run: bash pb/start-pb.sh &

      - name: Wait for PocketBase
        run: timeout 30 bash -c 'until curl -sf http://127.0.0.1:8090/api/health; do sleep 1; done'

      - name: Create CI admin
        run: ./pb/pocketbase admin create ci@example.com CIpassword123! --dir=/tmp/pb_data

      - name: Set up collections
        run: ./pb/setup_collections.sh ci@example.com CIpassword123!

      - name: Seed test users
        run: ./pb/seed_test_users.sh ci@example.com CIpassword123!

      - name: Start Vite dev server
        run: cd frontend && npm run dev &

      - name: Wait for Vite
        run: timeout 30 bash -c 'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 1; done'

      - name: Run full Playwright suite
        env:
          PB_SUPERUSER_EMAIL: ci@example.com
          PB_SUPERUSER_PASSWORD: CIpassword123!
        run: cd frontend && npm run test:full

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: frontend/playwright-report/
          retention-days: 7

      - name: Stop background services
        if: always()
        run: |
          pkill -f "pocketbase serve" || true
          pkill -f "vite" || true
          pkill -f "npm run dev" || true
