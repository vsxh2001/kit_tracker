name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Type-check and build
        run: cd frontend && npm run build

  docker:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: docker build --build-arg BUILDKIT_INLINE_CACHE=1 -t kit-tracker:ci .

  e2e:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Make binaries executable
        run: chmod +x pb/pocketbase pb/setup_collections.sh pb/seed_test_users.sh

      - name: Start PocketBase
        run: ./pb/pocketbase serve --http=0.0.0.0:8090 --dir=/tmp/pb_data --superuserEmail=ci@example.com --superuserPassword=CIpassword123! &

      - name: Wait for PocketBase
        run: timeout 30 bash -c 'until curl -sf http://127.0.0.1:8090/api/health; do sleep 1; done'

      - name: Set up collections
        run: ./pb/setup_collections.sh ci@example.com CIpassword123!

      - name: Seed test users
        run: ./pb/seed_test_users.sh ci@example.com CIpassword123!

      - name: Start Vite dev server
        run: cd frontend && npm run dev &

      - name: Wait for Vite
        run: timeout 30 bash -c 'until curl -sf http://localhost:5173 > /dev/null 2>&1; do sleep 1; done'

      - name: Run Playwright tests
        run: cd frontend && npm run test:ci

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
