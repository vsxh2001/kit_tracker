name: Daily PB Backup

on:
  schedule:
    - cron: "23 4 * * *"  # 04:23 UTC daily (off the :00 spike)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Run pocketbase backup via Fly SSH
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          mkdir -p backups
          SNAPSHOT="pb-snapshot-$(date -u +%Y%m%d-%H%M%S).zip"
          flyctl ssh console -a kit-tracker -C "/app/pocketbase backup '$SNAPSHOT' --dir=/app/pb_data"
          echo "Downloading: $SNAPSHOT"
          flyctl ssh sftp get -a kit-tracker "/app/pb_data/backups/$SNAPSHOT" "backups/$SNAPSHOT"

      - name: Validate snapshot size
        run: |
          SIZE=$(stat -c %s backups/pb-snapshot-*.zip 2>/dev/null | head -1)
          if [ -z "$SIZE" ] || [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: snapshot is missing or suspiciously small (${SIZE:-0} bytes)" >&2
            exit 1
          fi
          echo "✓ Snapshot size: $SIZE bytes"

      - name: Upload as release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="backup-$(date -u +%Y%m%d-%H%M%S)"
          SNAPSHOT=$(ls -t backups/pb-snapshot-*.zip | head -1)
          gh release create "$TAG" "$SNAPSHOT" \
            --title "Daily backup $TAG" \
            --notes "Automated daily snapshot."

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/prune-backup-releases.sh
