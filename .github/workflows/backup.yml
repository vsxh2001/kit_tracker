# Backup encryption: requires GitHub repository secret BACKUP_ENCRYPTION_KEY
# (passphrase, ~32 chars random). Generate: openssl rand -base64 32
# Set: gh secret set BACKUP_ENCRYPTION_KEY -b "<paste>"
# Lose the key = lose every backup. Store in 1Password/Bitwarden alongside Fly secrets.
name: Daily PB Backup

on:
  schedule:
    - cron: "23 4 * * *"  # 04:23 UTC daily (off the :00 spike)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Trigger PB backup via HTTP API
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          PB_SUPERUSER_EMAIL: ${{ secrets.PB_SUPERUSER_EMAIL }}
          PB_SUPERUSER_PASSWORD: ${{ secrets.PB_SUPERUSER_PASSWORD }}
          APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
        run: |
          set -euo pipefail
          SNAPSHOT="pb-snapshot-$(date -u +%Y%m%d-%H%M%S).zip"
          echo "SNAPSHOT=$SNAPSHOT" >> "$GITHUB_ENV"

          # Auth as superuser (v0.22 endpoint)
          TOKEN=$(curl -sf -X POST "$APP_BASE_URL/api/collections/_superusers/auth-with-password" \
            -H 'Content-Type: application/json' \
            -d "{\"identity\":\"$PB_SUPERUSER_EMAIL\",\"password\":\"$PB_SUPERUSER_PASSWORD\"}" \
            | jq -r '.token // empty')
          if [ -z "$TOKEN" ]; then
            echo "::error::superuser auth failed"
            exit 1
          fi

          # Trigger backup
          HTTP=$(curl -s -o /tmp/backup-resp.json -w '%{http_code}' -X POST "$APP_BASE_URL/api/backups" \
            -H "Authorization: $TOKEN" \  # PB v0.22 accepts raw token; v0.23+ may require 'Bearer $TOKEN'
            -H 'Content-Type: application/json' \
            -d "{\"name\":\"$SNAPSHOT\"}")
          if [ "$HTTP" != "204" ] && [ "$HTTP" != "200" ]; then
            echo "::error::backup HTTP failed (status $HTTP)"
            cat /tmp/backup-resp.json
            exit 1
          fi
          echo "Backup creation accepted (HTTP $HTTP)"

          # Poll until the backup appears in listing (creation is async-ish)
          for i in 1 2 3 4 5 6; do
            sleep 5
            LIST=$(curl -sf "$APP_BASE_URL/api/backups" -H "Authorization: $TOKEN")
            if echo "$LIST" | jq -e ".[] | select(.key == \"$SNAPSHOT\")" > /dev/null; then
              echo "Backup $SNAPSHOT present in listing"
              break
            fi
            if [ "$i" = "6" ]; then
              echo "::error::backup never appeared in listing after 30s"
              echo "$LIST" | jq
              exit 1
            fi
          done

      - name: SFTP pull backup ZIP
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p backups
          flyctl ssh sftp get -a kit-tracker "/app/pb_data/backups/$SNAPSHOT" "backups/$SNAPSHOT"
          ls -lah "backups/$SNAPSHOT"

      - name: Validate snapshot size
        run: |
          SIZE=$(stat -c %s backups/pb-snapshot-*.zip 2>/dev/null | head -1)
          if [ -z "$SIZE" ] || [ "$SIZE" -lt 100000 ]; then
            echo "ERROR: snapshot is missing or suspiciously small (${SIZE:-0} bytes)" >&2
            exit 1
          fi
          echo "✓ Snapshot size: $SIZE bytes"

      - name: GPG-encrypt snapshot
        env:
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: |
          if [ -z "$BACKUP_ENCRYPTION_KEY" ]; then
            echo "::error::BACKUP_ENCRYPTION_KEY secret missing — refusing to upload unencrypted snapshot"
            exit 1
          fi
          gpg --batch --yes --symmetric \
            --cipher-algo AES256 \
            --passphrase "$BACKUP_ENCRYPTION_KEY" \
            -o "backups/${SNAPSHOT}.gpg" \
            "backups/$SNAPSHOT"
          rm "backups/$SNAPSHOT"  # delete plaintext
          SNAPSHOT="${SNAPSHOT}.gpg"
          echo "SNAPSHOT=$SNAPSHOT" >> $GITHUB_ENV

      - name: Upload as release artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="backup-$(date -u +%Y%m%d-%H%M%S)"
          SNAPSHOT=$(ls -t backups/pb-snapshot-*.gpg | head -1)
          gh release create "$TAG" "$SNAPSHOT" \
            --title "Daily backup $TAG" \
            --notes "Encrypted with AES256 — restore requires BACKUP_ENCRYPTION_KEY."

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: bash scripts/prune-backup-releases.sh
