app = "kit-tracker"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile"

[env]
  PB_HTTP = "0.0.0.0:8090"
  PB_DATA_DIR = "/app/pb_data"
  PB_HOOKS_DIR = "/app/pb/pb_hooks"
  PB_MIGRATIONS_DIR = "/app/pb/pb_migrations"
  PB_PUBLIC_DIR = "/app/pb_public"

[[services]]
  internal_port = 8090
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    handlers = ["http"]
    port = 80
    force_https = true

  [[services.ports]]
    handlers = ["tls", "http"]
    port = 443

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 80

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/api/health"

[mounts]
  source = "pb_data"
  destination = "/app/pb_data"

[[vm]]
  memory_mb = 512
  cpu_kind = "shared"
  cpus = 1
